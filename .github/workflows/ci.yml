name: CI Test Suite

on:
  push:
    # Run on every push to any branch
  pull_request:
    # Run on all pull requests
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest test_three_body.py -v --tb=short -m "not slow"

    - name: Run all tests with coverage
      run: |
        pytest test_three_body.py -v --cov=three_body_integrator --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run physics conservation tests
      run: |
        pytest test_three_body.py::TestJacobiConstantConservation -v --tb=long
        pytest test_three_body.py::TestAngularMomentumInRotatingFrame -v --tb=long
        pytest test_three_body.py::TestEnergyRelations -v --tb=long

    - name: Run numerical accuracy tests
      run: |
        pytest test_three_body.py::TestNumericalAccuracy -v --tb=long

    - name: Run Lagrange point tests
      run: |
        pytest test_three_body.py::TestLagrangePoints -v --tb=long

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 three_body_integrator.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 three_body_integrator.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      continue-on-error: true

    - name: Check test file syntax
      run: |
        flake8 test_three_body.py --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
