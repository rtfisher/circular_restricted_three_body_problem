[pytest]
# Pytest configuration for CR3BP test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Test markers for selective test execution
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for full system behavior
    conservation: Tests for physical conservation laws
    numerical: Tests for numerical accuracy and convergence
    slow: Tests that take longer to run
    parametric: Parametric tests with multiple inputs

# Coverage options
[coverage:run]
source = three_body_integrator
omit =
    test_*.py
    */tests/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
